- name: Set up JDK
  uses: actions/setup-java@v4
  with:
    java-version: '17' # ou a versão que o seu projeto exigir
    distribution: 'temurin'

- name: Setup Gradle and Run Build
  uses: gradle/actions/setup-gradle@v4
  with:
    arguments: build # Substitua por assembleDebug se for um app Android
