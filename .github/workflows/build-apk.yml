name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar o Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # CORREÇÃO 1: Validar onde o arquivo está ou se o projeto está numa subpasta
    # Se o seu projeto Android NÃO estiver na raiz, altere o "working-directory" abaixo
    - name: Dar permissão de execução ao Gradle
      run: chmod +x ./gradlew
      # working-directory: ./nome-da-sua-subpasta # Descomente e altere se necessário

    - name: Compilar o APK (Release ou Debug)
      run: ./gradlew assembleDebug
      # working-directory: ./nome-da-sua-subpasta # Descomente e altere se necessário

    - name: Guardar o APK gerado como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
